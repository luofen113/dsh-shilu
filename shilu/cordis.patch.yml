# dsh-shilu —— 实录素材官（按日取会话事实，出「当日素材摘要」）
#
# 它做什么：注册两个宿主侧工具 ——
#   shilu_materials({date})                     出当日素材摘要（人可读 + 结构化计数）
#   handnote_write({to,subject,body,evidence})  往《DSH实录》卷三追加一札
#
# 它不做什么（红线）：
#   不产日稿文件 · 不写实录正文（卷三札须 agent 显式调用）· 不监听 session/event
#   · 不注册投影单元 · 不代 agent 归类
#
# 本包 manifest 已声明 dsh.bundle.patch，故本文件即本包**自带的 bundle 层**；
# profile 的 cordis.patch.yml 里**不要再写同 id 的 insert**（会插两遍）。
- insert:
    - id: shilu
      name: 'dsh-shilu'
