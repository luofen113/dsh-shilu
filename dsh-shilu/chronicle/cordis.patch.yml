# ============================================================================
# dsh-chronicle 的 bundle patch —— 把实录投影挂进 DSH 配置树
# ============================================================================
#
# 【这是什么】
#   本包的"挂载声明"。DSH 启动时按 bundle 层栈把各插件的 patch 叠起来组成
#   配置树；本文件就是 dsh-chronicle 这一层。
#
# 【工作原理】
#   - insert：往配置树里加新的插件行（entry）
#   - id：行标识（patch 覆盖时按它定位）
#   - name：插件模块名 → 解析包入口 lib/index.js（宿主半侧）
#
# 【依赖前提】
#   本插件 inject `sessionProjections`。该注册表由 dsh-base 层的
#   `session-projection` 行提供（id: session-projection），随 dsh-base
#   一起装入，无需在此重复声明。
#
# 【注册什么】
#   apply() 里注册两个 host-only 投影单元（无 wire、无界面）：
#     chronicleDossier   —— 纪传体：工具 / 文件 / 目录 / 网址
#     chronicleNarrative —— 本末体：每轮一条专题线（意图 / 追加指令 / 步数 / 触及路径 / 结局）
#                          另有 stats 累计总账（不随「只留最近四十条」的截断丢失）
#   状态由 session-projection-cache 落盘到 ~/.dsh/storages/session_projcache/。
#
# ============================================================================

- insert:
    - id: chronicle
      name: 'dsh-chronicle'
